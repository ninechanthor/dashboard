<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IB Truck Queue Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg:#f4f5f3; --surface:#ffffff; --ink:#1d2421; --muted:#66706b; --line:#dde1de;
    --accent:#0f766e; --accent-soft:#d5ece9; --danger:#b42318;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#121715; --surface:#1a211f; --ink:#e7ecea; --muted:#94a09b; --line:#2b3532;
            --accent:#4fd1c5; --accent-soft:#1d3a37; --danger:#ff8a7a; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { font-family:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
         background:var(--bg); color:var(--ink); line-height:1.5;
         padding:20px clamp(12px,3vw,32px) 40px; }
  header { display:flex; justify-content:space-between; align-items:flex-end; flex-wrap:wrap; gap:12px; margin-bottom:18px; }
  h1 { font-size:22px; font-weight:600; margin:0; }
  h2 { font-size:16px; font-weight:600; margin:0 0 4px; }
  #status { color:var(--muted); font-size:13px; }
  #status.error { color:var(--danger); }
  .tools { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  select, button { font:inherit; color:var(--ink); background:var(--surface); border:1px solid var(--line);
                   border-radius:6px; padding:7px 10px; }
  button { cursor:pointer; } button:hover { border-color:var(--accent); }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }

  .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; margin-bottom:18px; }
  .kpi { background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:12px 16px; }
  .kpi .label { color:var(--muted); font-size:13px; }
  .kpi .num { font-size:26px; font-weight:600; font-variant-numeric:tabular-nums; }
  .kpi .sub { color:var(--muted); font-size:12px; }
  .kpi.main { border-left:4px solid var(--accent); }

  .panel { background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:16px; margin-bottom:18px; }
  .panel p { margin:0 0 10px; color:var(--muted); font-size:13px; }
  .chart-wrap { position:relative; height:360px; }
  .chart-wrap.short { height:280px; }

  .scroll { overflow-x:auto; }
  table { border-collapse:collapse; width:100%; font-size:14px; }
  th, td { padding:8px 12px; text-align:left; white-space:nowrap; border-bottom:1px solid var(--line); }
  th { background:var(--accent-soft); font-weight:600; }
  td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; }
  tbody tr { cursor:pointer; }
  tbody tr:hover, tbody tr.sel { background:var(--accent-soft); }
</style>
</head>
<body>

<header>
  <div>
    <h1 id="title">IB Truck Queue</h1>
    <div id="status">กำลังโหลดข้อมูล…</div>
  </div>
  <div class="tools">
    <label for="siteSel">กลุ่ม</label>
    <select id="siteSel"></select>
    <button id="refreshBtn" type="button">โหลดข้อมูลใหม่</button>
  </div>
</header>

<section class="kpis" id="kpis"></section>

<section class="panel">
  <h2>ลงทะเบียนและรับงานรายชั่วโมง</h2>
  <p>แท่งด้านบน = registered, แท่งด้านล่าง = completed, เส้น = remain</p>
  <div class="chart-wrap"><canvas id="chartHourly"></canvas></div>
</section>

<section class="panel">
  <h2>ยอดสะสม</h2>
  <p>เทียบ registered กับ completed สะสมตามชั่วโมง (completed แสดงเป็นค่าบวกเพื่อเทียบกัน)</p>
  <div class="chart-wrap short"><canvas id="chartAcc"></canvas></div>
</section>

<section class="panel">
  <h2>ภาพรวมทุกกลุ่ม</h2>
  <p>คลิกแถวเพื่อดูกราฟของกลุ่มนั้น</p>
  <div class="scroll"><table id="overview"></table></div>
</section>

<script>
// URL ของ Cloudflare Worker (ตรวจชื่อให้ตรงกับของคุณ)
const API_URL = "https://sheet-proxy.nine-chanthor.workers.dev";
const REFRESH_MS = 2 * 60 * 1000;

let blocks = [], selected = "";
let chartH = null, chartA = null;

const $ = id => document.getElementById(id);
const fmt = n => Number.isFinite(n) ? n.toLocaleString("th-TH", { maximumFractionDigits: 2 }) : "-";
const num = v => {
  const s = String(v ?? "").replace(/[,\s]/g, "");
  if (s === "") return 0;
  const n = Number(s);
  return Number.isFinite(n) ? n : 0;
};

// หาคอลัมน์จากชื่อหัวตาราง (ไม่สนตัวพิมพ์เล็กใหญ่)
function colIndex(b, name) {
  const i = b.columns.findIndex(c => c.toLowerCase() === name.toLowerCase());
  return i < 0 ? -1 : i + 2; // +2 เพราะแถวข้อมูลขึ้นต้นด้วย [time, hour]
}
function series(b, name, abs) {
  const i = colIndex(b, name);
  if (i < 0) return null;
  return b.rows.map(r => abs ? Math.abs(num(r[i])) : num(r[i]));
}
const sum = a => a ? a.reduce((x, y) => x + y, 0) : 0;
function cssVar(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function showUpdated(b) {
  const d = new Date(b.updated);
  return (!b.updated || isNaN(d) || d.getFullYear() < 2000) ? "-" : d.toLocaleString("th-TH", { dateStyle: "medium", timeStyle: "short" });
}

/* ---------- load ---------- */
async function load() {
  const st = $("status");
  try {
    const res = await fetch(API_URL + "?t=" + Date.now());
    if (!res.ok) throw new Error((await res.text()) || "HTTP " + res.status);
    const data = await res.json();
    blocks = data.blocks || [];
    if (!blocks.length) throw new Error("ไม่พบบล็อกข้อมูล (ตรวจ SHEET_RANGE ของ Worker)");
    const sel = $("siteSel");
    sel.innerHTML = "";
    blocks.forEach(b => sel.add(new Option(b.name, b.name)));
    if (!blocks.some(b => b.name === selected)) selected = blocks[0].name;
    sel.value = selected;
    st.className = "";
    st.textContent = `${blocks.length} กลุ่ม · โหลดล่าสุด ${new Date().toLocaleTimeString("th-TH")}`;
    renderAll();
  } catch (e) {
    st.className = "error";
    st.textContent = "โหลดข้อมูลไม่สำเร็จ: " + e.message;
  }
}

/* ---------- render ---------- */
function current() { return blocks.find(b => b.name === selected) || blocks[0]; }

function renderAll() { renderKpis(); renderHourly(); renderAcc(); renderOverview(); }

function renderKpis() {
  const b = current();
  $("title").textContent = b.name + " · IB Truck Queue";
  const reg4 = series(b, "registered 4W"), reg6 = series(b, "registered 6W");
  const c4 = series(b, "completed 4W", true), c6 = series(b, "completed 6W", true);
  const remain = series(b, "remain");
  const items = [
    ["Registered รวม", fmt(sum(reg4) + sum(reg6)), `4W ${fmt(sum(reg4))} · 6W ${fmt(sum(reg6))}`, true],
    ["Completed รวม", fmt(sum(c4) + sum(c6)), `4W ${fmt(sum(c4))} · 6W ${fmt(sum(c6))}`],
  ];
  if (remain && remain.length) {
    const last = remain[remain.length - 1];
    const peak = Math.max(...remain);
    items.push(["Remain ล่าสุด", fmt(last), "สูงสุด " + fmt(peak)]);
  }
  items.push(["ข้อมูล ณ", showUpdated(b), b.date || ""]);
  const box = $("kpis");
  box.innerHTML = "";
  items.forEach(([l, n, s, main]) => {
    const d = document.createElement("div");
    d.className = "kpi" + (main ? " main" : "");
    d.innerHTML = '<div class="label"></div><div class="num"></div><div class="sub"></div>';
    d.children[0].textContent = l; d.children[1].textContent = n; d.children[2].textContent = s;
    d.children[1].style.fontSize = n.length > 12 ? "16px" : "";
    box.appendChild(d);
  });
}

function baseOptions(b, extraScales) {
  const muted = cssVar("--muted"), line = cssVar("--line");
  return {
    responsive: true, maintainAspectRatio: false,
    interaction: { mode: "index", intersect: false },
    plugins: {
      legend: { position: "bottom", labels: { color: muted, boxWidth: 12 } },
      tooltip: { callbacks: { title: items => b.rows[items[0].dataIndex]?.[0] || "" } }
    },
    scales: Object.assign({
      x: { stacked: true, title: { display: true, text: "IB hours", color: muted }, ticks: { color: muted }, grid: { display: false } },
      y: { stacked: true, ticks: { color: muted }, grid: { color: line } }
    }, extraScales || {})
  };
}

function renderHourly() {
  const b = current();
  const labels = b.rows.map(r => r[1]);
  const mk = (name, color, abs, neg) => {
    const d = series(b, name, false);
    return d ? { type: "bar", label: name, data: d, backgroundColor: color, stack: "bars", order: 2 } : null;
  };
  const ds = [
    mk("registered 4W", "#3b82f6"),
    mk("registered 6W", "#ef4444"),
    mk("completed 4W", "#8b5cf6"),
    mk("completed 6W", "#14b8a6"),
  ].filter(Boolean);
  const remain = series(b, "remain");
  if (remain) ds.push({
    type: "line", label: "remain", data: remain, borderColor: "#eab308", backgroundColor: "#eab308",
    stack: "remainLine", tension: 0.3, pointRadius: 2, borderWidth: 2, order: 1
  });
  if (chartH) chartH.destroy();
  chartH = new Chart($("chartHourly"), { type: "bar", data: { labels, datasets: ds }, options: baseOptions(b) });
}

function renderAcc() {
  const b = current();
  const labels = b.rows.map(r => r[1]);
  const ds = [];
  const reg = series(b, "register accumulated");
  const comp = series(b, "completed accumulated", true);
  if (reg) ds.push({ label: "registered สะสม", data: reg, borderColor: "#3b82f6", backgroundColor: "#3b82f6", tension: 0.25, pointRadius: 2 });
  if (comp) ds.push({ label: "completed สะสม", data: comp, borderColor: "#14b8a6", backgroundColor: "#14b8a6", tension: 0.25, pointRadius: 2 });
  const opts = baseOptions(b, {
    x: { title: { display: true, text: "IB hours", color: cssVar("--muted") }, ticks: { color: cssVar("--muted") }, grid: { display: false } },
    y: { beginAtZero: true, ticks: { color: cssVar("--muted") }, grid: { color: cssVar("--line") } }
  });
  if (chartA) chartA.destroy();
  chartA = new Chart($("chartAcc"), { type: "line", data: { labels, datasets: ds }, options: opts });
}

function renderOverview() {
  const t = $("overview");
  t.innerHTML = "";
  const head = t.createTHead().insertRow();
  ["กลุ่ม", "Registered", "Completed", "Remain ล่าสุด", "ข้อมูล ณ"].forEach((h, i) => {
    const th = document.createElement("th"); th.textContent = h; if (i >= 1 && i <= 3) th.className = "num"; head.appendChild(th);
  });
  const body = t.createTBody();
  blocks.forEach(b => {
    const reg = sum(series(b, "registered 4W")) + sum(series(b, "registered 6W"));
    const comp = sum(series(b, "completed 4W", true)) + sum(series(b, "completed 6W", true));
    const rem = series(b, "remain");
    const tr = body.insertRow();
    if (b.name === selected) tr.className = "sel";
    const cells = [b.name, fmt(reg), fmt(comp), rem && rem.length ? fmt(rem[rem.length - 1]) : "-", showUpdated(b)];
    cells.forEach((v, i) => { const td = tr.insertCell(); td.textContent = v; if (i >= 1 && i <= 3) td.className = "num"; });
    tr.onclick = () => { selected = b.name; $("siteSel").value = b.name; renderAll(); window.scrollTo({ top: 0, behavior: "smooth" }); };
  });
}

$("siteSel").addEventListener("change", e => { selected = e.target.value; renderAll(); });
$("refreshBtn").addEventListener("click", load);
load();
setInterval(load, REFRESH_MS);
</script>
</body>
</html>
